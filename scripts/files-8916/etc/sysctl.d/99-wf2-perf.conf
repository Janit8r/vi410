# WF2 network performance defaults.
# Applied by /etc/init.d/sysctl at boot, re-applied by /etc/init.d/wf2-perf.

# BBR needs an fq qdisc underneath it to pace packets; without it BBR
# degrades to plain cwnd-limited behaviour and loses most of its benefit.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Keep the congestion window across idle gaps. A 4G link goes quiet between
# bursts; without this every burst restarts from scratch and ramps slowly.
net.ipv4.tcp_slow_start_after_idle = 0

# Recover from PMTU black holes instead of stalling the tunnel.
net.ipv4.tcp_mtu_probing = 1

# TCP Fast Open, client and server side.
net.ipv4.tcp_fastopen = 3
